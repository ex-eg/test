<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الملفات وقاعدة البيانات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>لوحة تحكم الملفات وقاعدة البيانات</h1>
            <p>رفع الملفات وعرض البيانات بسهولة وسرعة</p>
        </header>

        <!-- قسم رفع الملفات -->
        <section class="card">
            <h2>رفع ملف جديد</h2>
            <form id="uploadForm">
                <div class="file-drop-area">
                    <span class="file-msg">اختر ملفاً أو اسحبه هنا</span>
                    <input type="file" id="fileInput" required>
                </div>
                <button type="submit" class="btn">رفع الملف</button>
            </form>
            <div id="uploadStatus" class="status-msg"></div>
        </section>

        <!-- قسم عرض البيانات -->
        <section class="card">
            <h2>بيانات قاعدة البيانات</h2>
            <button id="fetchDataBtn" class="btn secondary">تحديث وعرض البيانات</button>
            <div class="table-responsive">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>التفاصيل / البيانات</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="2" class="no-data">انقر على زر التحديث لعرض البيانات</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
